version: '3.8'

# redis-insight 连接串：
# mac 上 host.docker.internal:26379

services:
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      - /Users/adam/docker_all/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - redis-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "25540:5540"
    volumes:
      - /Users/adam/docker_all/redis-insight:/db
    depends_on:
      - redis
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
