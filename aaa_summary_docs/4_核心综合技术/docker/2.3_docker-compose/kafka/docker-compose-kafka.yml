version: '3.8'

services:
  # Kafka Broker 服务：使用 Apache 官方镜像，KRaft 模式
  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "29092:29092"  # 宿主机访问端口
      - "29093:29093"  # 控制器端口映射（可选，通常内部用即可，但映射出来方便调试）
    environment:
      # KRaft 模式配置
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093

      # 监听器配置：区分内部(INTERNAL)和外部(EXTERNAL)
      # INTERNAL: 用于 Docker 内部容器间通信 (kafka-ui -> kafka)
      # EXTERNAL: 用于宿主机或其他外部客户端访问
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # 其他优化配置
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-net

  # Kafka UI 服务：图形化管理界面
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "29094:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kafka-official
      # 使用 INTERNAL listener 的地址，即容器名:内部端口
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - kafka-net

volumes:
  kafka_data:
    driver: local

networks:
  kafka-net:
    driver: bridge
